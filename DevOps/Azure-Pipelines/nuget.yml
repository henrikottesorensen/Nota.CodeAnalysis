trigger:
  - main

# Pull requests build now. They did not, and the only thing this repository ships is configuration -
# so a change that silently stopped a rule from reporting could not be caught by anything before it
# merged. The verification step below is what makes building a pull request worth anything.
pr:
  - main

variables:
  - group: github-packages

pool:
  name: "Nota OnPremise Agents"

stages:
  - stage: Build
    jobs:
    - job: Build
      displayName: Build
      variables:
        - name: solution
          value: "Nota.CodeAnalysis.sln"
        - name: buildPlatform
          value: "Any CPU"
        - name: buildConfiguration
          value: "Release"
      steps:
        # .NET 10, not 8. An analyser cannot reference a newer Roslyn than the compiler running it:
        # UsingLayoutAnalyser is built against 4.14, SDK 8 runs 4.11, and the result is CS9057 - a
        # warning, not an error - with UA1000 and UA1001 silently absent. Verified on 8.0.423, where
        # StyleCop still reported and the using rules did not.
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            version: 10.x
        - task: DownloadSecureFile@1
          name: "nuget"
          displayName: "Download NuGet.config from secure storage"
          inputs:
            secureFile: "NuGet.config"
        - task: DotNetCoreCLI@2
          displayName: Nuget restore solution
          inputs:
            command: "restore"
            restoreSolution: "$(solution)"
            feedsToUse: "config"
            nugetConfigPath: $(nuget.secureFilePath)
        - task: DotNetCoreCLI@2
          displayName: 'Build'
          inputs:
            command: 'build'
            arguments: '--configuration $(buildConfiguration)'
            projects: "$(solution)"
        # The rules are asserted to actually report, against a project that breaks them on purpose.
        # Assumes a bash-capable agent; swap for PowerShell@2 if these are Windows agents.
        - task: Bash@3
          displayName: "Verify the rules report"
          inputs:
            filePath: "Nota.CodeAnalysis.Verification/verify.sh"

        # The encoding guard that replaces SA1412. Nothing in the compiler covers this: a file saved
        # as Windows-1252 builds clean and reaches the assembly as U+FFFD.
        - task: Bash@3
          displayName: "Verify source encoding"
          inputs:
            filePath: "Nota.CodeAnalysis.Verification/verify-encoding.sh"

        - task: DotNetCoreCLI@2
          displayName: "Generate Nuget package"
          # Only main publishes. Without this a pull request build would push a package.
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          inputs:
            command: 'pack'
            arguments: '--configuration $(buildConfiguration)'
            packagesToPack: "$(solution)"
            nobuild: true
            versioningScheme: 'off'
        - task: DotNetCoreCLI@2
          displayName: Publish nuget packages
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          inputs:
            command: 'custom'
            custom: 'nuget'
            arguments: 'push "$(Build.ArtifactStagingDirectory)/**/*.nupkg" --source https://nuget.pkg.github.com/Notalib/index.json --skip-duplicate --api-key "$(github_token)"'
